[project]
name = "fee-savings-service"
version = "0.1.0"
description = "Service for estimating trading fee savings from Hyperliquid account data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.10.0",
    "uvicorn>=0.35.0",
    "websockets>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fee_savings_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/fee_savings_service/static" = "fee_savings_service/static"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
